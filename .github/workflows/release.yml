name: Release

# Erstellt ein GitHub-Release mit pay-check.html zum Herunterladen und den
# Notizen aus CHANGELOG.md – beim Push eines Versions-Tags (z.B. v2.0.0) oder von
# Hand über „Run workflow“ (legt den Tag dann auf dem gewählten Branch an).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versions-Tag, z.B. v2.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    name: Release erstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Version prüfen
        run: |
          v="${TAG#v}"
          grep -q "const APP_VERSION='$v'" index.html || { echo "APP_VERSION in index.html passt nicht zu $TAG"; exit 1; }
          grep -q "\"version\": \"$v\"" package.json || { echo "version in package.json passt nicht zu $TAG"; exit 1; }
      - name: Release-Notizen aus CHANGELOG.md
        run: |
          v="${TAG#v}"
          {
            awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md | sed '/^### /s/^### /#### /'
            echo
            echo '**[Pay-Check öffnen →](https://paul-rafael.github.io/pay-check/)**'
            echo
            echo 'Offline nutzen: `pay-check.html` herunterladen und im Browser öffnen.'
            echo
            echo 'Alle Werte sind Näherungswerte und ersetzen keine Lohn- oder Steuerberatung.'
          } > notes.md
          cat notes.md
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp index.html pay-check.html
          gh release create "$TAG" pay-check.html --title "Pay-Check ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA"
